asyncapi: "3.1.0"
info:
  title: Refs and OAuth3 Test API
  version: 1.0.0
  description: Exercises $ref in servers/tags and AsyncAPI 3.0 OAuth2 syntax.

servers:
  production:
    $ref: '#/components/servers/production'
  staging:
    $ref: '#/components/servers/staging'

channels:
  orderCreated:
    address: order/created
    messages:
      orderCreatedMessage:
        name: orderCreated
        payload:
          type: object
          properties:
            orderId:
              type: string

operations:
  onOrderCreated:
    action: receive
    channel:
      $ref: '#/channels/orderCreated'
    tags:
      - $ref: '#/components/tags/orders'

tags:
  - $ref: '#/components/tags/orders'
  - $ref: '#/components/tags/admin'

components:
  servers:
    production:
      host: broker.example.com
      port: 5672
      protocol: amqp
      description: Production AMQP broker
      tags:
        - $ref: '#/components/tags/orders'

    staging:
      host: staging-broker.example.com
      port: 5672
      protocol: amqp
      description: Staging AMQP broker

  tags:
    orders:
      name: orders
      description: Order-related operations
    admin:
      name: admin
      description: Administrative operations

  securitySchemes:
    oauth2:
      type: oauth2
      description: OAuth2 security scheme
      flows:
        clientCredentials:
          tokenUrl: https://auth.example.com/oauth/token
          refreshUrl: https://auth.example.com/oauth/refresh
          availableScopes:
            read:orders: Read order data
            write:orders: Create and update orders
        authorizationCode:
          authorizationUrl: https://auth.example.com/oauth/authorize
          tokenUrl: https://auth.example.com/oauth/token
          availableScopes:
            read:orders: Read order data
            write:orders: Create and update orders
      scopes:
        - read:orders
        - write:orders
